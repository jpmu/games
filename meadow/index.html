<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meadow Walk</title>
<style>
  :root { --ink:#1b1d24; --card:rgba(20,22,30,.72); --text:#f3efe6; --muted:#b9b4a8; }
  html,body { margin:0; height:100%; background:#2c4a24; overflow:hidden; touch-action:none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:var(--text); }
  canvas { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  .hud { position:fixed; top:16px; left:16px; background:var(--card); border:2px solid #000;
    box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset, 4px 4px 0 rgba(0,0,0,.35);
    padding:10px 14px; border-radius:6px; font-size:12px; line-height:1.6; max-width:calc(100vw - 64px); }
  .hud b { font-size:14px; letter-spacing:.06em; }
  .hud span { color:var(--muted); }
  .bubble { position:fixed; transform:translate(-50%,-100%); background:#fff8e6; color:var(--ink);
    border:2px solid #000; padding:6px 10px; border-radius:6px; font-size:12px; white-space:nowrap;
    box-shadow:3px 3px 0 rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .15s; }
  .bubble.show { opacity:1; }
  .stick { position:fixed; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(0,0,0,.18); pointer-events:none; display:none; }
  .stick i { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px;
    border-radius:50%; background:rgba(255,255,255,.55); border:2px solid #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b>MEADOW</b><br><span id="help">WASD / Arrows to walk · Shift to run</span></div>
<div class="bubble" id="bubble"></div>
<div class="stick" id="stick"><i></i></div>
<script>
(() => {
"use strict";
const SPRITES = "sprites.png";

// ---------- setup ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const bubble = document.getElementById("bubble"), stickEl = document.getElementById("stick");
const T = 32, MW = 60, MH = 40, WW = MW * T, WH = MH * T;
let Z = 2, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
  Z = (Math.min(innerWidth, innerHeight) < 560 ? 1.5 : 2) * DPR;
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", resize); resize();

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1337);
const pick = a => a[(R() * a.length) | 0];

// ---------- terrain ----------
const GRASS = 0, PATH = 1, SAND = 2, WATER = 3, FOAM = 4;
const tiles = new Uint8Array(MW * MH);
function carve(x0, y0, x1, y1) {
  for (let y = Math.min(y0, y1); y <= Math.max(y0, y1) + 1; y++)
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1) + 1; x++)
      if (x >= 0 && y >= 0 && x < MW && y < MH) tiles[y * MW + x] = PATH;
}
carve(13, 10, 13, 19); carve(0, 19, 47, 19); carve(43, 19, 43, 22); carve(28, 19, 28, MH - 1); carve(28, 30, 12, 30);
const POND = { cx: 44 * T, cy: 28 * T, rx: 7.5 * T, ry: 5 * T };
function pondVal(x, y) {
  const dx = (x - POND.cx) / POND.rx, dy = (y - POND.cy) / POND.ry;
  return Math.sqrt(dx * dx + dy * dy) + 0.035 * Math.sin(x * 0.11) + 0.035 * Math.cos(y * 0.13);
}
function terrainAt(x, y) {
  const p = pondVal(x, y);
  if (p < 0.94) return WATER;
  if (p < 1.0) return FOAM;
  if (p < 1.22) return SAND;
  const tx = x / T | 0, ty = y / T | 0;
  return tiles[ty * MW + tx] === PATH ? PATH : GRASS;
}

const ground = document.createElement("canvas"); ground.width = WW; ground.height = WH;
(function paintGround() {
  const g = ground.getContext("2d"), id = g.createImageData(WW, WH), buf = new Uint32Array(id.data.buffer);
  const C = h => { const n = parseInt(h.slice(1), 16); return 0xff000000 | (n & 255) << 16 | (n >> 8 & 255) << 8 | n >> 16; };
  const P = {
    [GRASS]: ["#5c9a41", "#5c9a41", "#5c9a41", "#55923d", "#64a347"].map(C),
    [PATH]:  ["#c9a56b", "#c9a56b", "#bf9b60", "#d1ae74"].map(C),
    [SAND]:  ["#e3d095", "#e3d095", "#d9c584", "#eadaa2"].map(C),
    [WATER]: ["#3b7cc2", "#3b7cc2", "#3776bb", "#4083c8"].map(C),
    [FOAM]:  ["#9cd0ef", "#bfe3f6", "#8cc4e8"].map(C),
  };
  const deep = C("#2f68a8");
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    let t = terrainAt(x, y);
    // ragged grass edges over path
    if (t === PATH) {
      const lx = x % T, ly = y % T, tx = x / T | 0, ty = y / T | 0;
      const gN = ty > 0 && tiles[(ty - 1) * MW + tx] !== PATH, gS = ty < MH - 1 && tiles[(ty + 1) * MW + tx] !== PATH;
      const gW = tx > 0 && tiles[ty * MW + tx - 1] !== PATH, gE = tx < MW - 1 && tiles[ty * MW + tx + 1] !== PATH;
      const d = Math.min(gN ? ly : 99, gS ? T - 1 - ly : 99, gW ? lx : 99, gE ? T - 1 - lx : 99);
      if (d < 3 && R() < (3 - d) / 4) t = GRASS;
    }
    let col = pick(P[t]);
    if (t === WATER && pondVal(x, y) < 0.6) col = deep;
    buf[y * WW + x] = col;
  }
  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < WW && y < WH) buf[(y | 0) * WW + (x | 0)] = c; };
  // grass tufts + flowers, path pebbles
  const tuftD = C("#447a31"), tuftL = C("#7dbb57"), peb = C("#e6cc95"), pebD = C("#a8854f");
  const flowerCols = ["#f4f1e8", "#f2c94c", "#e86a8a", "#9b8cf0", "#f08a4b"].map(C), fc = C("#f6d36b");
  for (let i = 0; i < 9000; i++) {
    const x = R() * WW | 0, y = R() * WH | 0, t = terrainAt(x, y);
    if (t === GRASS) { put(x, y, tuftD); put(x - 1, y - 1, tuftD); put(x + 1, y - 1, tuftD); put(x, y - 1, tuftL); }
    else if (t === PATH && R() < .5) { put(x, y, peb); put(x + 1, y, peb); put(x, y + 1, pebD); put(x + 1, y + 1, pebD); }
  }
  for (let i = 0; i < 260; i++) {
    const cx = R() * WW | 0, cy = R() * WH | 0;
    if (terrainAt(cx, cy) !== GRASS) continue;
    const col = pick(flowerCols), n = 3 + (R() * 4 | 0);
    for (let k = 0; k < n; k++) {
      const x = cx + (R() * 18 - 9) | 0, y = cy + (R() * 12 - 6) | 0;
      if (terrainAt(x, y) !== GRASS) continue;
      put(x, y + 2, tuftD); put(x, y - 1, col); put(x - 1, y, col); put(x + 1, y, col); put(x, y + 1, col); put(x, y, fc);
    }
  }
  g.putImageData(id, 0, 0);
})();

// water sparkle points
const sparkles = [];
for (let i = 0; i < 140; i++) {
  const x = POND.cx + (R() * 2 - 1) * POND.rx, y = POND.cy + (R() * 2 - 1) * POND.ry;
  if (terrainAt(x, y) === WATER && terrainAt(x + 6, y) === WATER) sparkles.push({ x: x | 0, y: y | 0, o: R() * 6.28, s: .8 + R() * 1.5 });
}

// ---------- pixel-art prop sprites ----------
function sprite(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w + 2; c.height = h + 2;
  const g = c.getContext("2d"); g.translate(1, 1); draw(g, (x, y, col) => { g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); });
  // 1px dark outline
  const id = g.getImageData(0, 0, c.width, c.height), d = id.data, W = c.width, H = c.height, out = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (d[(y * W + x) * 4 + 3]) continue;
    const n = [[1,0],[-1,0],[0,1],[0,-1]].some(([a, b]) => { const X = x + a, Y = y + b; return X >= 0 && Y >= 0 && X < W && Y < H && d[(Y * W + X) * 4 + 3]; });
    if (n) out[y * W + x] = 1;
  }
  for (let i = 0; i < W * H; i++) if (out[i]) { d[i*4] = 27; d[i*4+1] = 26; d[i*4+2] = 34; d[i*4+3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function blob(px, cx, cy, rx, ry, cols, lx = -0.5, ly = -0.6, rand = R) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
    const dx = (x - cx) / rx, dy = (y - cy) / ry, r = dx * dx + dy * dy;
    if (r > 1) continue;
    const l = -(dx * lx + dy * ly) + (rand() - .5) * .35 + r * .25;
    px(x, y, cols[Math.max(0, Math.min(cols.length - 1, Math.floor((l + .7) / 1.6 * cols.length)))]);
  }
}
const LEAF = ["#a6d462", "#7fbf4d", "#5c9e3b", "#427d2e", "#2f5e24"];
const PINE = ["#6fae63", "#4f9152", "#3a7444", "#2a5636"];
const makeOak = () => sprite(48, 64, (g, px) => {
  g.fillStyle = "#6d4a2c"; g.fillRect(20, 40, 8, 22); g.fillStyle = "#523621"; g.fillRect(25, 40, 3, 22);
  g.fillStyle = "#86603b"; g.fillRect(21, 42, 1, 18); g.fillStyle = "#6d4a2c"; g.fillRect(17, 59, 14, 3);
  blob(px, 14, 32, 12, 10, LEAF); blob(px, 34, 32, 12, 10, LEAF); blob(px, 24, 20, 17, 15, LEAF);
  for (let i = 0; i < 6; i++) px(10 + R() * 26, 10 + R() * 22, "#c4e47c");
});
const makePine = () => sprite(40, 70, (g, px) => {
  g.fillStyle = "#5e3f26"; g.fillRect(17, 54, 6, 14);
  [[58, 19], [44, 16], [30, 12], [17, 8]].forEach(([base, hw], k) => {
    for (let y = 0; y < 20; y++) {
      const w = Math.round(hw * (y / 20)) + 1, yy = base - 20 + y;
      for (let x = -w; x <= w; x++) {
        const l = x / (w + 1);
        px(20 + x, yy, PINE[Math.min(3, Math.max(0, Math.floor((l + 1) * 1.6 + (R() - .5) * .9 + y / 22)))]);
      }
    }
  });
});
const makeRock = () => sprite(22, 15, (g, px) => blob(px, 11, 8, 10, 7, ["#d9d6d0", "#b4b0aa", "#8f8b86", "#6c6964"]));
const makeBush = () => sprite(26, 18, (g, px) => {
  blob(px, 8, 11, 8, 7, LEAF); blob(px, 18, 11, 8, 7, LEAF); blob(px, 13, 8, 9, 8, LEAF);
  for (let i = 0; i < 4; i++) { const x = 5 + R() * 16, y = 5 + R() * 9; px(x, y, "#e2475a"); px(x + 1, y, "#b8304a"); }
});
const makeHouse = () => sprite(112, 104, (g, px) => {
  const r = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  r("#7a6a64", 76, 4, 11, 30); for (let y = 6; y < 30; y += 4) r("#5f514c", 76, y, 11, 1); r("#3c3330", 75, 2, 13, 3);
  r("#e8d6b0", 12, 50, 88, 50); for (let y = 54; y < 94; y += 6) r("#d6c095", 12, y, 88, 1);
  r("#8a8a94", 12, 94, 88, 6); for (let x = 14; x < 100; x += 8) r("#6f6f7a", x, 94, 1, 6);
  for (let row = 0; row < 48; row++) {
    const y = 8 + row, half = 22 + row * 0.72 | 0;
    const col = row < 2 ? "#d8705a" : (row % 7 === 6 ? "#8f3329" : (row % 7 < 2 ? "#c55444" : "#b5473a"));
    r(col, 56 - half, y, half * 2, 1);
  }
  r("#8f3329", 0, 54, 112, 3);
  r("#4a2d18", 46, 70, 20, 30); r("#6b4426", 48, 72, 16, 28); r("#5a3820", 55, 72, 2, 28); r("#e8c050", 61, 86, 2, 2);
  [[20, 64], [76, 64]].forEach(([x, y]) => {
    r("#5b4030", x - 1, y - 1, 18, 17); r("#9fd3ef", x + 1, y + 1, 14, 13); r("#d6f0fb", x + 2, y + 2, 4, 3);
    r("#5b4030", x + 7, y + 1, 2, 13); r("#5b4030", x + 1, y + 7, 14, 2);
    r("#7a4a28", x - 2, y + 15, 20, 4);
    for (let i = 0; i < 6; i++) px(x + 1 + i * 3, y + 14, pick(["#e86a8a", "#f2c94c", "#f4f1e8"]));
  });
});
const makeSign = () => sprite(22, 24, (g) => {
  g.fillStyle = "#5e3f26"; g.fillRect(10, 10, 3, 14);
  g.fillStyle = "#c89a5c"; g.fillRect(0, 0, 22, 12); g.fillStyle = "#a87c45"; g.fillRect(0, 10, 22, 2);
  g.fillStyle = "#6b4a2a"; g.fillRect(4, 3, 14, 1); g.fillRect(4, 6, 10, 1);
});

// ---------- world objects ----------
// Each object: x,y = foot anchor (art px). img drawn with its bottom-centre at the anchor.
// col = collider [x0,y0,x1,y1] relative to anchor.
const objects = [];
const HOUSE = { x: 14 * T, y: 10 * T + 2 };
objects.push({ ...HOUSE, img: makeHouse(), col: [-44, -42, 44, 0] });
const signs = [
  { x: 11 * T + 8, y: 11 * T + 20, text: "Welcome home. Go explore!" },
  { x: 39 * T, y: 21 * T + 28, text: "The pond — no swimming." },
  { x: 30 * T + 20, y: 33 * T, text: "South trail: more meadow ahead." },
];
const SIGN = makeSign();
signs.forEach(s => objects.push({ x: s.x, y: s.y, img: SIGN, col: [-4, -4, 4, 0], sign: s }));

const oaks = Array.from({ length: 5 }, makeOak), pines = Array.from({ length: 4 }, makePine);
const rocks = Array.from({ length: 3 }, makeRock), bushes = Array.from({ length: 3 }, makeBush);
const SPAWN = { x: 14 * T + 0, y: 11 * T + 24 };
function freeSpot(x, y, pad) {
  for (let dy = -pad; dy <= pad; dy += 4) for (let dx = -pad; dx <= pad; dx += 4) {
    const t = terrainAt(x + dx, y + dy); if (t !== GRASS) return false;
  }
  if (Math.abs(x - HOUSE.x) < 80 && y > HOUSE.y - 110 && y < HOUSE.y + 40) return false;
  if (Math.hypot(x - SPAWN.x, y - SPAWN.y) < 60) return false;
  return !objects.some(o => Math.hypot(o.x - x, o.y - y) < pad + 14);
}
function addTree(x, y, force) {
  if (!force && !freeSpot(x, y, 18)) return;
  const pine = R() < .4;
  objects.push({ x, y, img: pine ? pick(pines) : pick(oaks), col: pine ? [-4, -6, 4, 0] : [-6, -6, 6, 0] });
}
// border forest so the meadow feels enclosed
for (let x = 0; x < WW; x += 22) { addTree(x + R() * 10, 18 + R() * 30, true); addTree(x + R() * 10, WH - 4 - R() * 26, true); }
for (let y = 40; y < WH - 30; y += 22) { addTree(10 + R() * 26, y + R() * 10, true); addTree(WW - 10 - R() * 26, y + R() * 10, true); }
// groves + scattered trees
const groves = [[6, 4], [24, 6], [36, 8], [52, 10], [8, 30], [20, 36], [36, 36], [54, 36], [4, 14], [22, 25]];
groves.forEach(([gx, gy]) => { for (let i = 0; i < 9; i++) addTree(gx * T + (R() - .5) * 150, gy * T + (R() - .5) * 110); });
for (let i = 0; i < 70; i++) addTree(60 + R() * (WW - 120), 60 + R() * (WH - 120));
for (let i = 0; i < 45; i++) { const x = 60 + R() * (WW - 120), y = 60 + R() * (WH - 120); if (freeSpot(x, y, 12)) objects.push({ x, y, img: pick(rocks), col: [-9, -6, 9, 0] }); }
for (let i = 0; i < 55; i++) { const x = 60 + R() * (WW - 120), y = 60 + R() * (WH - 120); if (freeSpot(x, y, 12)) objects.push({ x, y, img: pick(bushes), col: [-10, -6, 10, 0] }); }

// ---------- player ----------
const sheet = new Image(); sheet.src = SPRITES;
const FS = 128;            // frame size on the sheet
const ROW = { down: 0, left: 1, right: 2, up: 3 };
// Row 2 of the source faces left except one frame, so left = mirrored right cycle (consistent).
const CYCLE = { down: [[0,0],[0,1],[0,2],[0,3]], up: [[3,0],[3,1],[3,2],[3,3]],
                right: [[2,1],[2,2],[2,3],[2,2]], left: [[2,1],[2,2],[2,3],[2,2]] };
const IDLE  = { down: [0,0], up: [3,0], right: [1,0], left: [1,0] };
const FLIP  = { left: true, right: false };
const IDLE_FLIP = { left: false, right: true }; // the standing side frame faces left in the source
const player = { x: SPAWN.x, y: SPAWN.y, dir: "down", moving: false, t: 0, run: false };
const FOOT = [-7, -5, 7, 0];

function solidAt(x, y) {
  if (x < 8 || y < 8 || x > WW - 8 || y > WH - 2) return true;
  const t = terrainAt(x, y); if (t === WATER || t === FOAM) return true;
  for (const o of objects) {
    if (Math.abs(o.x - x) > 60 || Math.abs(o.y - y) > 60) continue;
    if (x >= o.x + o.col[0] && x <= o.x + o.col[2] && y >= o.y + o.col[1] && y <= o.y + o.col[3]) return true;
  }
  return false;
}
function blocked(x, y) {
  return solidAt(x + FOOT[0], y + FOOT[1]) || solidAt(x + FOOT[2], y + FOOT[1]) ||
         solidAt(x + FOOT[0], y + FOOT[3]) || solidAt(x + FOOT[2], y + FOOT[3]) || solidAt(x, y);
}

// ---------- input ----------
const keys = new Set();
addEventListener("keydown", e => { keys.add(e.key.toLowerCase()); if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault(); });
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
const stick = { on: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener("pointerdown", e => {
  stick.on = true; stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.dx = stick.dy = 0;
  stickEl.style.left = e.clientX + "px"; stickEl.style.top = e.clientY + "px"; stickEl.style.display = "block";
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!stick.on || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const m = Math.hypot(dx, dy), max = 48;
  if (m > max) { dx *= max / m; dy *= max / m; }
  stick.dx = dx / max; stick.dy = dy / max;
  stickEl.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
});
const endStick = e => { if (e.pointerId !== stick.id) return; stick.on = false; stick.dx = stick.dy = 0; stickEl.style.display = "none"; stickEl.firstElementChild.style.transform = ""; };
cv.addEventListener("pointerup", endStick); cv.addEventListener("pointercancel", endStick);
if (matchMedia("(pointer:coarse)").matches) document.getElementById("help").textContent = "Drag anywhere to walk · push far to run";

// ---------- ambient life ----------
const butterflies = Array.from({ length: 10 }, () => ({ x: 100 + R() * (WW - 200), y: 100 + R() * (WH - 200), a: R() * 6.28, p: R() * 6.28, c: pick(["#f4f1e8", "#f2c94c", "#e86a8a", "#9b8cf0"]) }));
const dust = [];

// ---------- loop ----------
let last = performance.now(), cam = { x: SPAWN.x, y: SPAWN.y };
function update(dt) {
  let ix = 0, iy = 0;
  if (keys.has("arrowleft") || keys.has("a")) ix -= 1;
  if (keys.has("arrowright") || keys.has("d")) ix += 1;
  if (keys.has("arrowup") || keys.has("w")) iy -= 1;
  if (keys.has("arrowdown") || keys.has("s")) iy += 1;
  let run = keys.has("shift");
  if (stick.on && Math.hypot(stick.dx, stick.dy) > .2) { ix = stick.dx; iy = stick.dy; run = Math.hypot(ix, iy) > .9; }
  const m = Math.hypot(ix, iy);
  player.moving = m > 0.01; player.run = run && player.moving;
  if (player.moving) {
    ix /= Math.max(1, m); iy /= Math.max(1, m);
    // facing: keep current dir if it's still one of the pressed axes, else pick dominant axis
    // Use the unit direction so light joystick pushes still resolve (one axis is always >= 0.707).
    const ux = ix / m, uy = iy / m;
    const h = ux < -0.38 ? "left" : ux > 0.38 ? "right" : null, v = uy < -0.38 ? "up" : uy > 0.38 ? "down" : null;
    if (player.dir !== h && player.dir !== v) player.dir = (Math.abs(ux) > Math.abs(uy) ? h || v : v || h) || player.dir;
    const sp = (player.run ? 125 : 70) * dt;
    const nx = player.x + ix * sp, ny = player.y + iy * sp;
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;
    player.t += dt * (player.run ? 12 : 8);
    if (player.run && Math.random() < dt * 18) dust.push({ x: player.x + (Math.random() - .5) * 10, y: player.y - 1, life: .45, max: .45 });
  } else player.t = 0;
  for (const d of dust) { d.life -= dt; d.y -= dt * 8; }
  while (dust.length && dust[0].life <= 0) dust.shift();
  for (const b of butterflies) { b.a += (Math.random() - .5) * dt * 4; b.x += Math.cos(b.a) * 22 * dt; b.y += Math.sin(b.a) * 22 * dt; b.p += dt * 18;
    if (b.x < 60 || b.x > WW - 60 || b.y < 60 || b.y > WH - 60) b.a += Math.PI; }
  // camera
  const vw = cv.width / Z, vh = cv.height / Z;
  cam.x += (player.x - cam.x) * Math.min(1, dt * 8); cam.y += (player.y - 24 - cam.y) * Math.min(1, dt * 8);
  cam.x = Math.max(vw / 2, Math.min(WW - vw / 2, cam.x)); cam.y = Math.max(vh / 2, Math.min(WH - vh / 2, cam.y));
  if (vw > WW) cam.x = WW / 2; if (vh > WH) cam.y = WH / 2;
}

function draw(now) {
  const vw = cv.width / Z, vh = cv.height / Z;
  const ox = Math.round((cam.x - vw / 2) * Z) / Z, oy = Math.round((cam.y - vh / 2) * Z) / Z;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#2c4a24"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(Z, 0, 0, Z, -ox * Z, -oy * Z); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ground, 0, 0);
  // water sparkles
  const t = now / 1000;
  for (const s of sparkles) { const a = Math.sin(t * s.s + s.o); if (a < .4) continue;
    ctx.fillStyle = `rgba(220,240,255,${(a - .4) * 1.4})`; ctx.fillRect(s.x, s.y, 4, 1); ctx.fillRect(s.x + 1, s.y - 1, 2, 1); }
  // y-sorted drawables
  const list = [];
  for (const o of objects) if (o.x > ox - 80 && o.x < ox + vw + 80 && o.y > oy - 10 && o.y < oy + vh + 130) list.push(o);
  list.push(player); list.sort((a, b) => a.y - b.y);
  for (const o of list) {
    if (o === player) { drawPlayer(); continue; }
    ctx.fillStyle = "rgba(20,40,10,.28)"; ctx.beginPath(); ctx.ellipse(o.x, o.y, o.img.width * .36, 3.5, 0, 0, 7); ctx.fill();
    ctx.drawImage(o.img, Math.round(o.x - o.img.width / 2), Math.round(o.y - o.img.height + 1));
  }
  // dust
  for (const d of dust) { ctx.fillStyle = `rgba(235,225,200,${d.life / d.max * .7})`; const s = 2 + (1 - d.life / d.max) * 3; ctx.fillRect(d.x - s / 2, d.y - s / 2, s, s); }
  // butterflies on top
  for (const b of butterflies) { const w = Math.sin(b.p) > 0 ? 2 : 1; ctx.fillStyle = b.c; ctx.fillRect(b.x - w, b.y, w, 2); ctx.fillRect(b.x + 1, b.y, w, 2); ctx.fillStyle = "#222"; ctx.fillRect(b.x, b.y, 1, 2); }
  // soft vignette
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * .35, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * .75);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(10,20,10,.35)"); ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
  // sign bubble
  const near = signs.find(s => Math.hypot(s.x - player.x, s.y - player.y) < 34);
  if (near) { bubble.textContent = near.text; bubble.style.left = ((near.x - ox) * Z / DPR) + "px"; bubble.style.top = ((near.y - 30 - oy) * Z / DPR) + "px"; bubble.classList.add("show"); }
  else bubble.classList.remove("show");
}

function drawPlayer() {
  const p = player;
  ctx.fillStyle = "rgba(20,40,10,.35)"; ctx.beginPath(); ctx.ellipse(p.x, p.y, 12, 4, 0, 0, 7); ctx.fill();
  if (!sheet.complete || !sheet.naturalWidth) return;
  if (!CYCLE[p.dir]) p.dir = "down";
  let r, c, flip;
  if (p.moving) { [r, c] = CYCLE[p.dir][Math.floor(p.t) % 4]; flip = !!FLIP[p.dir]; }
  else { [r, c] = IDLE[p.dir]; flip = !!IDLE_FLIP[p.dir]; }
  const S = 64; // drawn size in art px (sheet frames are 128px -> crisp at zoom 2)
  ctx.save(); ctx.translate(Math.round(p.x * 2) / 2, Math.round(p.y * 2) / 2); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(sheet, c * FS, r * FS, FS, FS, -S / 2, -S + 2, S, S);
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(frame); // schedule first so one bad frame can never stop the game
  try { update(dt); draw(now); } catch (err) { console.error(err); }
}
// Phones can drop a touch (notification, app switch) without a pointerup — reset input so nothing sticks.
cv.addEventListener("lostpointercapture", endStick);
document.addEventListener("visibilitychange", () => { if (document.hidden) { keys.clear(); endStick({ pointerId: stick.id }); } last = performance.now(); });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
